# Las imágenes de producto, servidas por CDN.
#
# MinIO vive en Compose sobre el host, así que el clúster necesita verlo como un
# servicio más: Service sin selector y EndpointSlice escrito a mano, igual que
# Harbor. Traefik le pone el certificado y Cloudflare cachea el resultado.
#
# Sin esto, cada foto de cada producto viaja desde el VPS a cada visitante, una y
# otra vez. Con esto, MinIO sirve cada imagen una vez y el borde reparte el resto
# desde el país del comprador.
---
apiVersion: v1
kind: Service
metadata: { name: minio-pro, namespace: default }
spec:
  ports: [{ name: http, port: 9010, targetPort: 9010 }]
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: minio-pro
  namespace: default
  labels: { kubernetes.io/service-name: minio-pro }
addressType: IPv4
ports: [{ name: http, port: 9010 }]
endpoints: [{ addresses: ["172.17.0.1"] }]
---
apiVersion: v1
kind: Service
metadata: { name: minio-pre, namespace: default }
spec:
  ports: [{ name: http, port: 9000, targetPort: 9000 }]
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: minio-pre
  namespace: default
  labels: { kubernetes.io/service-name: minio-pre }
addressType: IPv4
ports: [{ name: http, port: 9000 }]
endpoints: [{ addresses: ["172.17.0.1"] }]
---
apiVersion: v1
kind: Service
metadata: { name: minio-des, namespace: default }
spec:
  ports: [{ name: http, port: 9020, targetPort: 9020 }]
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: minio-des
  namespace: default
  labels: { kubernetes.io/service-name: minio-des }
addressType: IPv4
ports: [{ name: http, port: 9020 }]
endpoints: [{ addresses: ["172.17.0.1"] }]
---
# Freno contra la descarga masiva del catálogo.
#
# Una ficha de producto carga entre 10 y 20 imágenes, así que alguien navegando
# deprisa hace 100 o 200 peticiones por minuto. Un raspador hace miles. El tope
# deja pasar al primero con holgura y corta al segundo.
#
# Traefik ve la IP real del visitante y no la del proxy porque confía en los
# rangos de Cloudflare; sin eso, este límite se aplicaría a Cloudflare entera y
# cortaría a todo el mundo a la vez.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: limite-imagenes, namespace: default }
spec:
  rateLimit:
    average: 300
    burst: 600
    period: 1m
    sourceCriterion:
      ipStrategy:
        depth: 1        # la IP que Cloudflare pone en X-Forwarded-For
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: imagenes-pro
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.middlewares: default-limite-imagenes@kubernetescrd
spec:
  ingressClassName: traefik
  tls: [{ hosts: ["img.nx036.com"], secretName: img-tls }]
  rules:
    - host: img.nx036.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: minio-pro, port: { number: 9010 } } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: imagenes-pre
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.middlewares: default-limite-imagenes@kubernetescrd
spec:
  ingressClassName: traefik
  tls: [{ hosts: ["img-pre.nx036.com"], secretName: img-pre-tls }]
  rules:
    - host: img-pre.nx036.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: minio-pre, port: { number: 9000 } } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: imagenes-des
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.middlewares: default-limite-imagenes@kubernetescrd
spec:
  ingressClassName: traefik
  tls: [{ hosts: ["img-dev.nx036.com"], secretName: img-des-tls }]
  rules:
    - host: img-dev.nx036.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: minio-des, port: { number: 9020 } } }
