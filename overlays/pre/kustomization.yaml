apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nexadrop-pre

# Los manifiestos de base llegan en la fase 1, junto con Argo CD. Este overlay existe desde la
# fase 0 para que la integración continua tenga dónde escribir el tag candidato: así la cadena de
# entrega se prueba entera ANTES de que exista un clúster al que romper.
resources: []

images:
  - name: registry.nx036.com/nexadrop/backend
    newTag: sha-000000
  - name: registry.nx036.com/nexadrop/frontend
    newTag: sha-000000
