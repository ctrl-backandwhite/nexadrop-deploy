apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: nexadrop-pre
resources:
  - ../../base

# ESTA ES LA LÍNEA QUE ESCRIBE EL CI. Cada entrega la cambia por el SHA nuevo y
# Argo CD despliega lo que aquí ponga. Revertir es volver atrás este valor.
images:
  - name: registry.nx036.com/nexadrop/backend
    newTag: sha-0f701de957d86e4b2d5577e52b82414bf4a6a633
  - name: registry.nx036.com/nexadrop/frontend
    newTag: sha-fcfbd5465ee8b4ff17a0a8da05d835d1d43fa23e

configMapGenerator:
  - name: backend-config
    literals:
      # Espejado de imágenes: cuántas se procesan A LA VEZ y cuántas por ronda.
      #
      # Descomprimir una foto ocupa ancho x alto x 4 bytes, no lo que pesa el fichero. El compresor
      # decodifica saltando píxeles, así que cada imagen queda acotada en unos 40 MB por grande que
      # sea el original; el pico del espejado es por tanto CONCURRENCY x 40 MB.
      # 10Gi de límite, heap ~7 GB: 4 hilos son ~160 MB de pico, el 2% del montón.
      # 5-sep-2026: BAJADO A 1 DE URGENCIA. El codificador WebP nativo
      # (libwebp-imageio.so) no es seguro con varios hilos: con 4 la JVM cayó por
      # SIGSEGV dentro de `encode` y se llevó el backend entero — PRE quedó con las
      # dos réplicas sin servir. Producción, que ya estaba en 1, no ha reiniciado
      # ni una vez. Volver a subirlo SOLO cuando el cerrojo de CompresorDeImagen
      # esté desplegado, y aun entonces midiendo.
      # 5-sep-2026, 2a caida del dia: ESPEJADO PARADO. La JVM muere por SIGSEGV dentro del
      # codificador WebP nativo (libwebp-imageio 0.9.0) tras unas 550 imagenes, CON UN SOLO HILO y
      # con el cerrojo puesto — asi que no era concurrencia. Y como el intento solo se registra
      # DESPUES de procesar, una imagen que mata el proceso se reintenta para siempre: bucle de
      # caidas en las dos replicas.
      #
      # Se para aqui, y no bajando la concurrencia, porque mirror-enabled SI llega a la aplicacion
      # (esta declarada en application.yml). Volver a activarlo cuando este el arreglo de fondo.
      # Reactivado el 5-sep-2026 ya con el arreglo de fondo: el intento se anota ANTES de
      # procesar (asi una imagen que mate el proceso deja de volver eternamente) y una imagen
      # que ya fallo se espeja SIN comprimir. Peor caso: una foto pesa de mas, en vez de las
      # replicas cayendo en bucle. Ademas webp-imageio pasa de 0.9.0 a 0.11.0.
      - STORAGE_MIRROR_ENABLED=true
      - STORAGE_MIRROR_CONCURRENCY=1
      - STORAGE_MIRROR_BATCH=25
      # 172.17.0.1 es la interfaz interna de Docker: donde escuchan los servicios
      # con dato, que viven en Compose sobre el host y no en el clúster.
      - DB_HOST=172.17.0.1
      - DB_PORT=5432
      - REDIS_HOST=172.17.0.1
      - REDIS_PORT=6379
      - KAFKA_BOOTSTRAP=172.17.0.1:9092
      # Bus de integración: un Redpanda APARTE del interno de la tienda, para que
      # un cliente ruidoso o una integración caída no toquen el tráfico de la
      # tienda. Cerrado a internet: solo se llega desde la red interna de Docker.
      # Preproducción es donde se certifica: de aquí SALE el catálogo.
      - BUS_ENABLED=true
      - BUS_BOOTSTRAP_SERVERS=172.17.0.1:9122
      - OPENSEARCH_URIS=http://172.17.0.1:9200
      - MINIO_ENDPOINT=http://172.17.0.1:9000
      # El backend sube las imágenes por la red interna...
      - STORAGE_ENDPOINT=http://172.17.0.1:9000
      # ...pero al navegador le da esta otra dirección, que va por Cloudflare.
      # Es la diferencia entre que cada foto viaje desde el VPS a cada visitante,
      # o que MinIO la sirva UNA vez y el borde la reparta desde el país del
      # comprador. Con 200 GB de catálogo, no es un matiz.
      - STORAGE_PUBLIC_URL=https://img-pre.nx036.com/product-images
      - STORAGE_BUCKET=product-images
      - STORAGE_ACCESS_KEY=nexadrop
      - SPRING_PROFILES_ACTIVE=pre
      - DB_POOL_MAX=30
      - DB_POOL_MIN=5
      - STOREFRONT_BASE_URL=https://pre.nx036.com
      # Tipos de cambio (CurrencyLayer): la nota larga está en overlays/pro. Aquí no
      # hace falta la tasa del día —lo que se certifica es el cálculo, no el céntimo—
      # así que sincroniza solo los lunes y deja la cuota para producción. Hora UTC.
      - "NEXADROP_CURRENCY_SYNC_CRON=0 45 4 * * MON"   # lunes, 04:45 UTC

patches:
  - target: { kind: Ingress, name: frontend }
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: pre.nx036.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: pre.nx036.com
  - target: { kind: Ingress, name: backend }
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: api-pre.nx036.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: api-pre.nx036.com

  # Preproducción cede antes que producción, pero después que desarrollo.
  - target: { kind: Deployment, name: backend }
    patch: |-
      - op: add
        path: /spec/template/spec/priorityClassName
        value: nx036-preproduccion
  - target: { kind: Deployment, name: frontend }
    patch: |-
      - op: add
        path: /spec/template/spec/priorityClassName
        value: nx036-preproduccion

  # Dimensionado para 50.000 concurrentes: la mitad que producción. Reserva menos
  # de lo que puede usar, a propósito. Preproducción no tiene tráfico real salvo
  # cuando se le lanza una prueba de carga; reservarle memoria las 24 horas se la
  # quitaría a producción, que sí la necesita siempre.
  - target: { kind: Deployment, name: backend }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      # Ajustado a lo medido el 4-sep-2026: reservaba 1500m de CPU y 6 GB, y
      # consumía 330-350m y entre 1,9 y 3,7 GB. Preproducción no atiende tráfico
      # real, así que apartar millar y medio de CPU era quitárselo a producción y
      # al escaparate renderizado en servidor para nada.
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 6500Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 12500Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 1500m
  - target: { kind: Deployment, name: frontend }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  # El frontend ya no es nginx sirviendo ficheros, sino React renderizándose en el
  # servidor. Lo que se dimensiona por entorno es la CPU y el número de réplicas;
  # la MEMORIA se deja como está en la base (384Mi/768Mi) y es a propósito: lo que
  # ocupa un renderizador no depende del entorno, depende de cuántas páginas pinta
  # a la vez, y eso se resuelve con réplicas. Bajarla aquí a 512Mi, como estaba,
  # dejaría el tope por debajo del montón que la propia imagen le pide a Node.
  #
  # El parche va por NOMBRE de contenedor, no por índice: el pod tiene ahora dos
  # (el renderizador y la pasarela) y un `containers/0` acertaría de casualidad.
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: frontend
      spec:
        template:
          spec:
            containers:
              - name: frontend
                resources:
                  requests: { cpu: 300m }
