apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: nexadrop-des
resources:
  - ../../base

images:
  - name: registry.nx036.com/nexadrop/backend
    newTag: sha-28e503736f55b4f18a9a2d2dd963b647eb347852
  - name: registry.nx036.com/nexadrop/frontend
    newTag: sha-e5f2c59959bbca5c7b8796d77156072b3ba4afd9

configMapGenerator:
  - name: backend-config
    literals:
      - DB_HOST=172.17.0.1
      - DB_PORT=5452
      - REDIS_HOST=172.17.0.1
      - REDIS_PORT=6399
      - KAFKA_BOOTSTRAP=172.17.0.1:9112
      # Conexión al bus encendida, pero sin publicar ni consumir (los valores por defecto
      # del perfil `des`). Sirve para dos cosas: comprobar que la aplicación arranca con
      # los beans del bus creados —el riesgo real de esta configuración— y poder probar a
      # mano encendiendo un interruptor, sin que desarrollo mande nada a la tienda.
      - BUS_ENABLED=true
      - BUS_BOOTSTRAP_SERVERS=172.17.0.1:9122
      - OPENSEARCH_URIS=http://172.17.0.1:9220
      - MINIO_ENDPOINT=http://172.17.0.1:9020
      # El backend sube las imágenes por la red interna...
      - STORAGE_ENDPOINT=http://172.17.0.1:9020
      # ...pero al navegador le da esta otra dirección, que va por Cloudflare.
      # Es la diferencia entre que cada foto viaje desde el VPS a cada visitante,
      # o que MinIO la sirva UNA vez y el borde la reparta desde el país del
      # comprador. Con 200 GB de catálogo, no es un matiz.
      - STORAGE_PUBLIC_URL=https://img-dev.nx036.com/product-images
      - STORAGE_BUCKET=product-images
      - STORAGE_ACCESS_KEY=nexadrop
      - SPRING_PROFILES_ACTIVE=des
      # 50 usuarios no necesitan más: un pool grande aquí solo reservaría
      # conexiones en un Postgres que acepta 100.
      - DB_POOL_MAX=10
      - DB_POOL_MIN=2
      - STOREFRONT_BASE_URL=https://dev.nx036.com

patches:
  - target: { kind: Ingress, name: frontend }
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: dev.nx036.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: dev.nx036.com
  - target: { kind: Ingress, name: backend }
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: api-dev.nx036.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: api-dev.nx036.com
  # Desarrollo es el primero en ceder si la máquina se queda sin memoria. Es lo
  # que garantiza que trastear aquí no pueda tumbar la tienda.
  - target: { kind: Deployment, name: backend }
    patch: |-
      - op: add
        path: /spec/template/spec/priorityClassName
        value: nx036-desarrollo
  # Y pide la mitad de memoria: aquí no hay tráfico real que atender.
  - target: { kind: Deployment, name: backend }
    patch: |-
      # 200m de CPU y 1 GB no daban para arrancar: Spring Boot con Liquibase
      # migrando necesita músculo en el arranque aunque luego no atienda a nadie.
      # La sonda de arranque expiraba y Kubernetes mataba el contenedor en bucle.
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 1Gi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 2Gi
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 500m
  - target: { kind: Deployment, name: frontend }
    patch: |-
      - op: add
        path: /spec/template/spec/priorityClassName
        value: nx036-desarrollo
