apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: nexadrop-pro
resources:
  - ../../base
  - hpa.yaml

# Aquí NO escribe el CI. Este fichero solo cambia por pull request con revisión
# humana, que es lo que exige el CODEOWNERS: promocionar a producción es una
# decisión, no un efecto secundario de fusionar a la rama principal.
images:
  - name: registry.nx036.com/nexadrop/backend
    newTag: sha-ca46616dd8838b1a7df2510a648fe43349f72c0c
  - name: registry.nx036.com/nexadrop/frontend
    newTag: sha-7f7aa2759ab6dbf243a7296f64cb519ee2f0890d

configMapGenerator:
  - name: backend-config
    literals:
      # Espejado de imágenes: cuántas se procesan A LA VEZ y cuántas por ronda.
      #
      # Descomprimir una foto ocupa ancho x alto x 4 bytes, no lo que pesa el fichero. El compresor
      # decodifica saltando píxeles, así que cada imagen queda acotada en unos 40 MB por grande que
      # sea el original; el pico del espejado es por tanto CONCURRENCY x 40 MB.
      # 14Gi de límite, heap ~9,8 GB: 4 hilos son ~160 MB de pico. No se sube más porque el
      # cuello no es la memoria sino la descarga desde 1688, y más hilos solo añaden presión al origen.
      - STORAGE_MIRROR_CONCURRENCY=4
      - STORAGE_MIRROR_BATCH=25
      - DB_HOST=172.17.0.1
      - DB_PORT=5442
      - REDIS_HOST=172.17.0.1
      - REDIS_PORT=6389
      - KAFKA_BOOTSTRAP=172.17.0.1:9102
      # Bus de integración: un Redpanda APARTE del interno de la tienda, para que
      # un cliente ruidoso o una integración caída no toquen el tráfico de la
      # tienda. Cerrado a internet: solo se llega desde la red interna de Docker.
      # Producción solo RECIBE. No publica, o lo que consume volvería al bus.
      - BUS_ENABLED=true
      - BUS_BOOTSTRAP_SERVERS=172.17.0.1:9122
      - OPENSEARCH_URIS=http://172.17.0.1:9210
      - MINIO_ENDPOINT=http://172.17.0.1:9010
      # El backend sube las imágenes por la red interna...
      - STORAGE_ENDPOINT=http://172.17.0.1:9010
      # ...pero al navegador le da esta otra dirección, que va por Cloudflare.
      # Es la diferencia entre que cada foto viaje desde el VPS a cada visitante,
      # o que MinIO la sirva UNA vez y el borde la reparta desde el país del
      # comprador. Con 200 GB de catálogo, no es un matiz.
      - STORAGE_PUBLIC_URL=https://img.nx036.com/product-images
      - STORAGE_BUCKET=product-images
      - STORAGE_ACCESS_KEY=nexadrop
      - SPRING_PROFILES_ACTIVE=pro
      # 30 por réplica y no las 50 de fábrica: con el escalado a 10 réplicas
      # serían 500 conexiones contra un Postgres que acepta 500, y se agotarían
      # justo en el pico. Además, Postgres no rinde más por tener más conexiones
      # abiertas: con 18 núcleos, el punto dulce está en torno a 150 activas.
      - DB_POOL_MAX=30
      - DB_POOL_MIN=10
      - STOREFRONT_BASE_URL=https://nx036.com
      # Tipos de cambio (CurrencyLayer). Una sola llamada trae TODAS las divisas,
      # así que la cadencia es puro consumo de cuota. Estaba en `0 */5 * * * *` en
      # los TRES entornos y con la MISMA clave de API: 288 llamadas al día cada uno,
      # 864 en total, unas 26.000 al mes contra el mismo plan. Producción sincroniza
      # a diario; desarrollo y preproducción, solo los lunes, y a horas distintas
      # para no lanzar tres peticiones en el mismo segundo con una clave compartida.
      # Total: ~39 llamadas al mes.
      # El valor vivía en el Secret `backend-secretos`, fuera de este repositorio y
      # sin control de versiones: una expresión cron no es un secreto, y ahí nadie
      # veía lo que estaba costando. OJO: el contenedor va en UTC.
      - "NEXADROP_CURRENCY_SYNC_CRON=0 30 4 * * *"     # a diario, 04:30 UTC

patches:
  - target: { kind: Ingress, name: frontend }
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: nx036.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: nx036.com
  - target: { kind: Ingress, name: backend }
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: api.nx036.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: api.nx036.com
  # Dos réplicas en producción: con una, cada entrega es un corte de servicio y
  # cualquier caída del pod deja la tienda apagada hasta que Kubernetes reaccione.
  #
  # Las reservas se AJUSTARON A LA MEDIDA el 4-sep-2026, después de mirar lo que
  # el backend consume de verdad en este nodo:
  #
  #     reservaba          consumía
  #     2500m de CPU  ->   306-311m
  #     8 GB de RAM   ->   4,3 GB
  #
  # Estaban puestas «para 100.000 usuarios concurrentes», que era una previsión,
  # no una medición. Reservar es apartar: esos 5 CPU de las dos réplicas no los
  # podía usar nadie más, y con ellos el nodo figuraba al 53% de CPU reservada
  # usando en realidad la tercera parte. Con el renderizado en servidor del
  # escaparate, que sí consume CPU, ese sitio hace falta.
  #
  # Y había una consecuencia peor, que es la que de verdad importa: el
  # autoescalado NO PODÍA DISPARARSE NUNCA. El HPA mide el uso como porcentaje de
  # lo RESERVADO, así que con 2500m reservados el 70% son 1750m por réplica —cinco
  # veces el pico observado—. El autoescalado estaba puesto, se veía en el panel y
  # no habría movido ficha ni con la tienda saturada.
  #
  # 1000m es margen de sobra sobre los 311m medidos: cubre el arranque de la JVM,
  # que es el momento de más consumo, y deja el umbral del 70% en 700m, alcanzable
  # cuando de verdad haya carga. El LÍMITE de memoria no se toca: es el techo, y
  # bajarlo sí podría matar el proceso.
  - target: { kind: Deployment, name: backend }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 8500Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 16500Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 1600m
  - target: { kind: Deployment, name: frontend }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  # El frontend dejó de ser nginx sirviendo ficheros: ahora es React renderizándose
  # en el servidor, un proceso de un solo hilo donde cada visita cuesta CPU. Con
  # 256Mi/512Mi y sin reserva de CPU propia, cada página quedaba a expensas de que
  # el planificador le diera turno detrás del backend.
  #
  # Se reserva 500m: el doble que preproducción, porque aquí sí hay tráfico real y
  # porque es el valor sobre el que mide el autoescalado (el HPA compara el uso
  # contra la RESERVA, no contra el límite). Sin límite de CPU, igual que el
  # backend: un límite de CPU no ralentiza, estrangula en tramos de 100 ms.
  #
  # La MEMORIA se hereda de la base (384Mi/768Mi) en los tres entornos: lo que
  # ocupa un renderizador no depende del entorno, depende de cuántas páginas pinta
  # a la vez, y de eso se encarga el HPA subiendo réplicas.
  #
  # El parche va por NOMBRE de contenedor, no por índice: el pod tiene ahora dos
  # (el renderizador y la pasarela) y un `containers/0` acertaría de casualidad.
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: frontend
      spec:
        template:
          spec:
            containers:
              - name: frontend
                resources:
                  requests: { cpu: 500m }

  # Producción se desaloja la última si la máquina se queda sin memoria.
  - target: { kind: Deployment, name: backend }
    patch: |-
      - op: add
        path: /spec/template/spec/priorityClassName
        value: nx036-produccion
  - target: { kind: Deployment, name: frontend }
    patch: |-
      - op: add
        path: /spec/template/spec/priorityClassName
        value: nx036-produccion
