# Escalado automático SOLO en producción.
#
# Cuatro réplicas fijas reservarían memoria las 24 horas para atender el pico de
# una hora. Con esto, el suelo son 2 —suficiente para que una entrega no corte el
# servicio— y sube hasta 6 cuando de verdad hay carga.
#
# Ojo con lo que esto NO da: en un nodo único, más réplicas no son más
# disponibilidad. Si la máquina cae, caen todas. Eso solo lo arregla un segundo
# nodo.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  # Vuelve a 2 el 28-ago-2026. Se había bajado a 1 mientras el acceso con Google
  # fallaba al repartirse entre pods, y así se quedó: con una sola réplica, cada
  # entrega es un corte de servicio.
  #
  # Lo que lo hace seguro ahora es la AFINIDAD de sesión (cookie nx036_afinidad):
  # cada visitante vuelve siempre al mismo pod, así que el flujo de Google empieza
  # y termina donde debe. Comprobado el 28-ago-2026: preproducción lleva días con
  # dos réplicas y el acceso funciona.
  #
  # Ojo, la afinidad es un apaño, no la solución: Spring Session está configurado
  # para guardar en Redis pero NO actúa —la cookie que se emite sigue siendo
  # JSESSIONID de Tomcat y no SESSION—, así que si un pod se cae, quien estuviera
  # en él pierde la sesión. Mientras eso no se arregle, no conviene pasar de 6.
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
  behavior:
    scaleUp:
      # Sube rápido: el pico ya está ahí cuando se detecta.
      stabilizationWindowSeconds: 30
    scaleDown:
      # Y baja despacio: si no, el vaivén de una racha de tráfico deja el sistema
      # arrancando y matando pods sin parar.
      stabilizationWindowSeconds: 300
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    # Escalar por CPU es ahora la métrica CORRECTA, y antes no lo era: nginx
    # sirviendo ficheros nunca llegaba al 80% de nada, así que este autoescalado
    # era decorativo. Con el renderizado en servidor, la CPU sí es lo que se
    # agota, y este es el mando que de verdad sostiene el pico.
    #
    # Baja del 80% al 70% por una razón aritmética, no por prudencia: el tipo
    # `Resource` mide el pod ENTERO —suma el uso de los dos contenedores y lo
    # divide entre la suma de sus reservas—. La pasarela reserva 25m sobre los
    # 500m del renderizador y no gasta casi nada, así que DILUYE la medida en
    # torno a un 10%: cuando el renderizador va al 80% de lo suyo, el pod marca
    # ~73% y con el umbral en 80 el autoescalado todavía no habría movido ficha.
    # Con 70 se dispara donde se pretendía.
    #
    # Lo exacto sería `type: ContainerResource` apuntando al contenedor
    # `frontend`, que mide uno solo. Se deja fuera a propósito: si la versión de
    # Kubernetes no lo admite, el HPA no da error, simplemente deja de escalar
    # —y eso se descubre en el pico—. Merece la pena cambiarlo el día que se
    # confirme la versión del clúster.
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
