# Escalado automático SOLO en producción.
#
# Cuatro réplicas fijas reservarían memoria las 24 horas para atender el pico de
# una hora. Con esto, el suelo son 2 —suficiente para que una entrega no corte el
# servicio— y sube hasta 6 cuando de verdad hay carga.
#
# Ojo con lo que esto NO da: en un nodo único, más réplicas no son más
# disponibilidad. Si la máquina cae, caen todas. Eso solo lo arregla un segundo
# nodo.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  # Vuelve a 2 el 28-ago-2026. Se había bajado a 1 mientras el acceso con Google
  # fallaba al repartirse entre pods, y así se quedó: con una sola réplica, cada
  # entrega es un corte de servicio.
  #
  # Lo que lo hace seguro ahora es la AFINIDAD de sesión (cookie nx036_afinidad):
  # cada visitante vuelve siempre al mismo pod, así que el flujo de Google empieza
  # y termina donde debe. Comprobado el 28-ago-2026: preproducción lleva días con
  # dos réplicas y el acceso funciona.
  #
  # Ojo, la afinidad es un apaño, no la solución: Spring Session está configurado
  # para guardar en Redis pero NO actúa —la cookie que se emite sigue siendo
  # JSESSIONID de Tomcat y no SESSION—, así que si un pod se cae, quien estuviera
  # en él pierde la sesión. Mientras eso no se arregle, no conviene pasar de 6.
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
  behavior:
    scaleUp:
      # Sube rápido: el pico ya está ahí cuando se detecta.
      stabilizationWindowSeconds: 30
    scaleDown:
      # Y baja despacio: si no, el vaivén de una racha de tráfico deja el sistema
      # arrancando y matando pods sin parar.
      stabilizationWindowSeconds: 300
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 80 }
