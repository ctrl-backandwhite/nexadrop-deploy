# EL ESPEJADO DE IMÁGENES, FUERA DEL BACKEND QUE ATIENDE COMPRADORES.
#
# Por qué existe este despliegue aparte. Espejar consiste en bajar la foto del proveedor, comprimirla
# y guardarla. Dos de esas tres cosas son un mal vecino para una tienda:
#
#   1. Comprimir consume CPU y memoria de verdad —decodificar un JPEG grande ocupa ancho x alto x 4
#      bytes— y compite con las peticiones de quien está comprando.
#   2. El codificador WebP es código NATIVO. Un SIGSEGV suyo no se puede capturar: se lleva la máquina
#      virtual entera. El 5-sep-2026 pasó exactamente eso y dejó las dos réplicas de preproducción
#      cayendo en bucle, con el escaparate sin servir.
#
# Separándolo, el peor caso deja de ser «se cae la tienda» y pasa a ser «se cae un trabajador y
# Kubernetes lo levanta». La tienda ni se entera.
#
# NO lleva Service, y es a propósito: este pod no atiende a nadie, solo drena colas. Su etiqueta es
# distinta de la del backend para que el Service de la tienda no le mande tráfico por error.
#
# Va en base/, así que existe en los TRES entornos. Tiene que ser así: si solo estuviera en uno, los
# otros dos se quedarían sin espejar nada en cuanto su backend deja de hacerlo —y una imagen sin
# espejar es una imagen rota, porque el proveedor responde 403 a quien la enlaza desde fuera—. Lo que
# cada entorno ajusta por su cuenta es el RITMO (descargas por proveedor y tamaño de lote), no si
# existe o no.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-espejado
  labels: { app.kubernetes.io/name: backend-espejado }
spec:
  # Una sola. El techo que ve el proveedor es réplicas x descargas-por-origen, así que este número no
  # se sube sin ajustar el otro: 1688 limita por tasa y corta a quien insiste.
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: backend-espejado }
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 600
  strategy:
    type: Recreate   # No hay tráfico que preservar; y dos a la vez doblarían la carga al proveedor.
  template:
    metadata:
      labels: { app.kubernetes.io/name: backend-espejado }
    spec:
      imagePullSecrets:
        - name: harbor
      containers:
        - name: backend
          # LA MISMA IMAGEN que la tienda: no es otro programa, es el mismo con otro trabajo. Así no
          # hay un segundo artefacto que construir, versionar ni mantener al día. El tag lo reescribe
          # el mismo parche de kustomize que el del backend.
          image: registry.nx036.com/nexadrop/backend:sha-por-definir
          ports:
            - { name: http, containerPort: 18082 }
          env:
            # Cabeceras de objeto compactas: 22% menos de montón según el JEP 519. Aquí importa más
            # que en la tienda, porque este proceso trabaja con mapas de bits descomprimidos.
            - name: JAVA_TOOL_OPTIONS
              value: >-
                -XX:MaxRAMPercentage=70
                -XX:+ExitOnOutOfMemoryError
                -XX:+UseCompactObjectHeaders
                -XX:G1PeriodicGCInterval=120000
                -XX:+G1PeriodicGCInvokesConcurrent
            - { name: SERVER_PORT, value: "18082" }
            - { name: DB_NAME, value: nexadrop }
            - { name: DB_USER, value: nexadrop }
            # ESTE es el que espeja. En la tienda va a false.
            - { name: STORAGE_MIRROR_ENABLED, value: "true" }
            # EL WORKER NO MIGRA LA BASE. De eso se encarga la tienda, y solo ella.
            #
            # Los dos arrancaban ejecutando Liquibase y competían por el mismo cerrojo: el que llegaba
            # segundo se quedaba esperando («Waiting for changelog lock...») hasta que la sonda de
            # arranque lo mataba. Se vio en desarrollo el 18-sep-2026, con el worker muriendo en bucle
            # por exit 137 mientras esperaba un cerrojo que además llevaba cogido desde el 9-sep por un
            # pod que ya no existía.
            #
            # Con un solo migrador se acaba la carrera. Y el orden correcto sale gratis: la tienda es
            # quien tiene la sonda de arranque larga y quien debe estar al día del esquema antes de
            # atender a nadie; el worker solo lee y escribe filas que ya existen.
            - { name: SPRING_LIQUIBASE_ENABLED, value: "false" }
            # HILOS DE DESCARGA. Se declara aquí, y no se hereda del ConfigMap, porque ese valor lo
            # comparten la tienda y este proceso: en la tienda estaba bajado a mano para que comprimir
            # no le robara CPU a los compradores, y esa razón aquí ya no existe.
            #
            # Y era el cuello de verdad: con 4 hilos, el techo de 6 descargas por proveedor no se
            # alcanzaba nunca. Medido el 18-sep-2026 con 4 hilos: 977m de CPU y 1,7Gi en el pod, con el
            # nodo al 19%. Queda sitio.
            - { name: STORAGE_MIRROR_CONCURRENCY, value: "12" }
            # Descargas simultáneas POR PROVEEDOR, que es el techo que de verdad importa: el límite no
            # es nuestra máquina, es 1688 —responde 403 a quien enlaza desde fuera y corta a quien
            # insiste—. Se sube a la par que los hilos para que uno no anule al otro, pero sin pasarse:
            # lo que ve el proveedor es la SUMA de los tres entornos.
            - { name: STORAGE_DESCARGAS_POR_ORIGEN, value: "8" }
            # La compresión va en segunda pasada y sin prisa: la foto ya se ve.
            - { name: STORAGE_COMPRESION_BATCH, value: "10" }
          envFrom:
            - configMapRef: { name: backend-config }
            - secretRef: { name: backend-secretos }
          startupProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 10
            failureThreshold: 60
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 20
            failureThreshold: 3
            timeoutSeconds: 5
          # Sin readinessProbe: nadie le manda tráfico, así que «listo para recibir» no significa nada
          # aquí. La de arranque y la de vida sí, para que Liquibase termine y para reponerlo si muere.
          resources:
            # Reserva DELIBERADAMENTE modesta. Este despliegue añade un pod en cada uno de los tres
            # entornos, y la máquina ya iba justa: el 8-sep-2026 se midió carga 27-35 sobre 18 núcleos,
            # saturada de forma sostenida, y hubo que bajar reservas del backend por eso mismo.
            #
            # Y lo que hace este proceso es sobre todo ESPERAR RED. Reservar CPU que no usa se la quita
            # a quien sí la necesita. El pico de memoria es concurrencia x ~40 MB por imagen: el
            # compresor decodifica saltando píxeles, así que cada una queda acotada ahí por grande que
            # sea el original.
            #
            # El LÍMITE se subió de 2Gi a 3Gi el 18-sep-2026, tras ver morir el worker con OOMKilled
            # en preproducción mientras Liquibase aplicaba la migración v162. El error de cálculo fue
            # pensar que este proceso «solo espeja»: arranca la aplicación entera, con su contexto de
            # Spring y sus 171 migraciones, y eso pesa lo mismo aquí que en la tienda.
            #
            # Se sube el techo y NO la reserva: un límite no aparta memoria del nodo, solo dice hasta
            # dónde puede llegar el proceso antes de que lo maten. La reserva sigue siendo modesta
            # porque lo que este proceso hace de verdad es esperar red.
            #
            # 18-sep-2026, segunda subida: 3Gi -> 4Gi al pasar a 12 hilos. Y 19-sep, tercera: 4Gi ->
            # 6Gi, porque con 4Gi murió igualmente por OOM.
            #
            # El cálculo de «hilos x ~40 MB» se quedó corto, y conviene saber por qué: esos 40 MB son
            # el caso acotado del compresor, que decodifica saltando píxeles. Pero el pico real lo
            # marca la imagen MÁS GRANDE que coincida en vuelo, y una foto de 4000x4000 son 64 MB de
            # mapa de bits ella sola. Doce de esas a la vez no caben en 4Gi junto al resto.
            #
            # Un límite de memoria en Kubernetes es un TECHO DURO: cuando el proceso lo toca, el kernel
            # lo mata en ese instante. No hay ampliación sobre la marcha ni sirve liberar después,
            # porque el pico mata antes. Lo único que se puede hacer es dejar sitio para el pico —esto—
            # y devolver memoria cuando no se usa —el GC periódico de abajo—.
            #
            # Subir hilos por encima del techo de descargas por proveedor NO es un descuido: desde que
            # la memoria de URLs cubre también las variantes, buena parte de las tareas se resuelven
            # contra la base sin tocar la red y sin pedir turno al proveedor. Los hilos de más sirven
            # para despachar esos aciertos deprisa; los que sí descargan siguen limitados a 8.
            requests: { cpu: 200m, memory: 768Mi }
            limits: { memory: 6Gi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: temporal, mountPath: /tmp }
      volumes:
        - name: temporal
          emptyDir: {}
