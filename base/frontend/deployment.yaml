apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels: { app.kubernetes.io/name: frontend }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: frontend }
  # El pod nuevo tiene que aguantar 10 s sano ANTES de contar como bueno. Sin
  # esto, uno que pasa la sonda y se cae medio segundo después cuenta igual, y el
  # despliegue sigue bajando los viejos: acabas sin ninguno en pie.
  minReadySeconds: 10
  # Si a los 10 minutos el despliegue no ha terminado, se marca como fallido en
  # lugar de quedarse intentándolo en silencio para siempre.
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels: { app.kubernetes.io/name: frontend }
    spec:
      imagePullSecrets:
        - name: harbor
      containers:
        - name: frontend
          image: registry.nx036.com/nexadrop/frontend:sha-por-definir
          ports:
            - { name: http, containerPort: 3003 }
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 20
          resources:
            # Son ficheros estáticos servidos por nginx: pedir más es reservar
            # memoria que nadie usa y que le quita sitio a Postgres.
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 101            # el usuario nginx de la imagen alpine
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            # La imagen sin privilegios deja sus temporales y su pid en /tmp, así
            # que basta con este volumen: montar /var/cache/nginx y /var/run
            # sobrescribiría directorios con permisos correctos por otros que el
            # usuario 101 no podría escribir.
            - { name: temporal, mountPath: /tmp }
      volumes:
        - { name: temporal, emptyDir: {} }
