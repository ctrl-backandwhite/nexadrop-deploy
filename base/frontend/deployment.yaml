apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels: { app.kubernetes.io/name: frontend }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: frontend }
  # El pod nuevo tiene que aguantar 10 s sano ANTES de contar como bueno. Sin
  # esto, uno que pasa la sonda y se cae medio segundo después cuenta igual, y el
  # despliegue sigue bajando los viejos: acabas sin ninguno en pie.
  # Kubernetes guarda DIEZ ReplicaSets viejos por Deployment si nadie dice otra
  # cosa, y cada despliegue añade uno más que ya no levanta ningún pod. El
  # 18-sep-2026 había veintiséis en desarrollo y veinte en cada uno de los otros
  # dos entornos. No gastan CPU ni memoria, pero engordan el estado del clúster y
  # esconden lo que sí está vivo cuando hace falta mirar. Tres bastan para poder
  # volver atrás un par de versiones, que es para lo único que sirven.
  revisionHistoryLimit: 3
  minReadySeconds: 10
  # Si a los 10 minutos el despliegue no ha terminado, se marca como fallido en
  # lugar de quedarse intentándolo en silencio para siempre.
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels: { app.kubernetes.io/name: frontend }
    spec:
      imagePullSecrets:
        - name: harbor

      # ── UN solo proceso, y por qué ────────────────────────────────────────
      #
      # El escaparate es Angular con `outputMode: static`: las páginas públicas
      # se escriben AL CONSTRUIR la imagen y lo que corre aquí es nginx
      # entregando ficheros. No hay renderizador, no hay Node, no hay pid que
      # vigilar en producción.
      #
      # Antes había dos contenedores porque el escaparate de React se pintaba en
      # servidor: un proceso Node de un solo hilo pintando cada página, más un
      # nginx delante que le reenviaba lo que no era HTML. Eso trae consigo un
      # initContainer para copiar la configuración de nginx, un montón de V8 que
      # dimensionar a mano, sondas caras que renderizaban la portada entera y una
      # factura de CPU por visita. Nada de eso hace falta ahora, y por eso no está.
      #
      # nginx sigue escuchando en el 3003 —el puerto que ya conocían el Service y
      # el Ingress, que no cambian— y sigue reenviando `/api`, `/oauth2` y
      # compañía al backend, porque el navegador las pide al MISMO origen que la
      # página. Sus reglas viajan DENTRO de la imagen, en `conf.d/default.conf`,
      # atadas al mismo SHA que la aplicación: no existe la combinación
      # "aplicación nueva con pasarela vieja".
      containers:
        - name: frontend
          image: registry.nx036.com/nexadrop/frontend:sha-por-definir
          ports:
            - { name: http, containerPort: 3003 }

          # Las tres sondas piden la MISMA ruta, y es una ruta que no toca el
          # contenido: `/interno/salud` la responde nginx con un 200 de cuatro
          # bytes y sin escribir en el registro. La de arranque solo se distingue
          # por su paciencia.
          #
          # Deliberadamente NO se sondea `/`: la portada es un fichero
          # prerenderizado de cientos de kilobytes y preguntarla cada diez
          # segundos por réplica es tráfico y disco a cambio de nada. Y tampoco
          # `/robots.txt`, aunque exista: una sonda no debe depender de que un
          # fichero concreto haya salido del build.
          startupProbe:
            httpGet: { path: /interno/salud, port: http }
            periodSeconds: 3
            failureThreshold: 20        # hasta un minuto para levantar nginx
          readinessProbe:
            httpGet: { path: /interno/salud, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /interno/salud, port: http }
            periodSeconds: 20

          resources:
            # Vuelve a ser lo que era antes del renderizado en servidor: nginx
            # entregando ficheros. Cada petición es abrir un fichero ya
            # comprimido en disco (`gzip_static`) y volcarlo al socket; no hay
            # montón de V8 que crezca con la concurrencia ni CPU por página.
            #
            # No se pone LÍMITE de CPU, igual que en el backend: un límite de CPU
            # en Kubernetes no ralentiza, ESTRANGULA en tramos de 100 ms, y aquí
            # eso se traduce en respuestas lentas sin ninguna métrica que lo
            # explique.
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 192Mi }

          securityContext:
            # El proceso que da la cara a internet no corre como root. La imagen
            # se prepara para ello: escucha en el 3003 —muy por encima de los
            # puertos privilegiados—, deja su pid en /tmp y cede /var/cache/nginx
            # al usuario 101.
            runAsNonRoot: true
            runAsUser: 101              # el usuario `nginx` de la imagen alpine
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }

          volumeMounts:
            # UN solo volumen, y es todo lo que nginx necesita escribir: su pid y
            # sus temporales —ahí va también el cuerpo de las peticiones grandes,
            # como los lotes de importación de 20 MB—.
            #
            # La imagen redirige a /tmp los temporales que por omisión irían a
            # /var/cache/nginx. Sin eso hacían falta dos volúmenes Y un `fsGroup`,
            # porque los efímeros nacen de root y el proceso corre como 101:
            # nginx se negaba a arrancar con «mkdir() /var/cache/nginx/client_temp
            # failed (13: Permission denied)». Comprobado levantando la imagen.
            - { name: temporal, mountPath: /tmp }

      volumes:
        - { name: temporal, emptyDir: {} }
