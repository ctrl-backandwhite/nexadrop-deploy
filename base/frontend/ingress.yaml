apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.middlewares: default-solo-cloudflare@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts: ["por-definir"]
      secretName: frontend-tls
  rules:
    - host: por-definir
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port: { name: http }
