apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    # NO se filtra por IP de origen aquí, y es deliberado: Traefik confía en los
    # rangos de Cloudflare para recuperar la IP real del comprador —de la que
    # depende el cálculo del margen—, así que un ipAllowList compararía ESA IP
    # contra los rangos de Cloudflare y rechazaría a todo el mundo, aplicación
    # móvil incluida. Las dos cosas no pueden convivir; se comprobó el
    # 27-ago-2026 con la tienda entera devolviendo 403.
spec:
  ingressClassName: traefik
  tls:
    - hosts: ["por-definir"]
      secretName: backend-tls
  rules:
    - host: por-definir
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port: { name: http }
