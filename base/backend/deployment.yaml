apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels: { app.kubernetes.io/name: backend }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: backend }
  # El pod nuevo tiene que aguantar 30 s sano ANTES de contar como bueno. Sin
  # esto, uno que pasa la sonda y se cae medio segundo después cuenta igual, y el
  # despliegue sigue bajando los viejos: acabas sin ninguno en pie.
  minReadySeconds: 30
  # Si a los 10 minutos el despliegue no ha terminado, se marca como fallido en
  # lugar de quedarse intentándolo en silencio para siempre.
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0        # Nunca se baja una réplica antes de tener la nueva sana.
      maxSurge: 1
  template:
    metadata:
      labels: { app.kubernetes.io/name: backend }
    spec:
      # La imagen es privada: sin esto el pod se queda en ImagePullBackOff.
      imagePullSecrets:
        - name: harbor
      containers:
        - name: backend
          image: registry.nx036.com/nexadrop/backend:sha-por-definir
          ports:
            - { name: http, containerPort: 18082 }
          env:
            # MaxRAMPercentage y no -Xmx: la JVM lee el límite del contenedor, así
            # que cambiar el límite de memoria no obliga a tocar también esto. Con
            # un -Xmx fijo, subir el límite no da ni un byte más a la aplicación.
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError"
            - { name: SERVER_PORT, value: "18082" }
            - { name: DB_NAME, value: nexadrop }
            - { name: DB_USER, value: nexadrop }
          envFrom:
            # Lo que cambia entre PRE y PRO (máquinas, puertos, URL pública) y lo
            # que no puede estar en este repositorio (contraseñas, claves).
            - configMapRef: { name: backend-config }
            - secretRef: { name: backend-secretos }
          startupProbe:
            # Arranque lento y a propósito: Liquibase migra antes de servir. Sin
            # esta sonda, la de vitalidad mataría el pod a mitad de una migración
            # y la dejaría a medias, que es como se corrompe un esquema.
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 10
            failureThreshold: 60      # hasta 10 minutos
            # timeoutSeconds NO estaba puesto, así que valía el defecto de Kubernetes: UN segundo.
            # Para una aplicación que tarda entre 200 y 367 segundos en arrancar —medido el
            # 5-sep-2026 en las dos réplicas de PRE— y que hace trabajo de fondo pesado, un segundo
            # es un margen irreal: el 5-sep una réplica se quedó dando vueltas porque la sonda de
            # vida la mataba antes de que terminara de arrancar.
            #
            # Cinco segundos no debilitan la protección: una aplicación de verdad colgada tampoco
            # responde en cinco. Lo que se evita es matar a una que solo estaba ocupada.
            timeoutSeconds: 5
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 20
            failureThreshold: 3
            timeoutSeconds: 5
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { memory: 2Gi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            # Con el sistema de ficheros en solo lectura, la JVM y Tomcat siguen
            # necesitando dónde escribir sus temporales.
            - { name: temporal, mountPath: /tmp }
      volumes:
        - name: temporal
          emptyDir: {}
